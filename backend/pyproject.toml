[project]
name = "seminar-copilot-backend"
version = "0.1.0"
description = "Local seminar transcription and question tracking backend"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115.0",
  "mlx-whisper>=0.4.0",
  "numpy>=2.0.0",
  "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.0.0",
]
bailian = [
  "dashscope>=1.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
